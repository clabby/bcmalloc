<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="A consumer thread sends blocks to the producer that owns them through an outbox message and the producer’s inbox"><title>A consumer thread sends blocks to the producer that owns them through an outbox message and the producer’s inbox</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start">A remote free</text><text class="small muted" x="40" y="54" text-anchor="start">A consumer frees blocks that the producer’s heap owns. In a batch only pointers move between the threads, never the blocks.</text><rect class="panel" x="40" y="76" width="400" height="300" rx="8"/><text class="h" x="60" y="102" text-anchor="start">consumer thread, heap 7</text><text class="big t-purple" x="60" y="132" text-anchor="start">1</text><text class="mono b" x="84" y="132" text-anchor="start">free(p)</text><text class="small muted" x="84" y="152" text-anchor="start">one load of the chunk map entry of p</text><rect class="free" x="84" y="164" width="190" height="30" rx="5"/><text class="mono small" x="96" y="184" text-anchor="start">owner 2, class 96 B</text><text class="small muted" x="286" y="184" text-anchor="start">not this heap</text><text class="big t-purple" x="60" y="232" text-anchor="start">2</text><text class="b" x="84" y="232" text-anchor="start">append to the outbox for heap 2</text><text class="small muted" x="84" y="252" text-anchor="start">a 512 B block of heap 7, up to 62 pointers</text><rect class="purple" x="84" y="266" width="336" height="46" rx="6"/><rect class="free" x="96" y="276" width="28" height="26" rx="4"/><text class="mono small" x="110" y="294" text-anchor="middle">p</text><rect class="free" x="130" y="276" width="28" height="26" rx="4"/><text class="mono small" x="144" y="294" text-anchor="middle">p</text><rect class="free" x="164" y="276" width="28" height="26" rx="4"/><text class="mono small" x="178" y="294" text-anchor="middle">p</text><rect class="free" x="198" y="276" width="28" height="26" rx="4"/><text class="mono small" x="212" y="294" text-anchor="middle">p</text><rect class="free" x="232" y="276" width="28" height="26" rx="4"/><text class="mono small" x="246" y="294" text-anchor="middle">p</text><rect class="free" x="266" y="276" width="28" height="26" rx="4"/><text class="mono small" x="280" y="294" text-anchor="middle">p</text><rect class="free" x="300" y="276" width="28" height="26" rx="4"/><text class="mono small" x="314" y="294" text-anchor="middle">p</text><rect class="free" x="334" y="276" width="28" height="26" rx="4"/><text class="mono small" x="348" y="294" text-anchor="middle">p</text><text class="b" x="386" y="294" text-anchor="middle">…</text><text class="small muted" x="84" y="340" text-anchor="start">Sixteen outboxes, one per destination heap,</text><text class="small muted" x="84" y="358" text-anchor="start">fill side by side. The block p is never written.</text><text class="big t-purple" x="505" y="112" text-anchor="middle">3</text><text class="small" x="505" y="132" text-anchor="middle">when full,</text><text class="small" x="505" y="148" text-anchor="middle">one CAS</text><rect class="panel" x="570" y="76" width="370" height="300" rx="8"/><text class="h" x="590" y="102" text-anchor="start">producer thread, heap 2, the owner</text><text class="b" x="590" y="132" text-anchor="start">inbox</text><text class="small muted" x="640" y="132" text-anchor="start">a stack anyone pushes onto</text><rect class="purple" x="588" y="146" width="150" height="34" rx="6"/><text class="small" x="663" y="168" text-anchor="middle">message</text><path class="edge" d="M738 163 L760 163" marker-end="url(#a-muted)"/><rect class="free" x="762" y="146" width="160" height="34" rx="6"/><text class="small" x="842" y="168" text-anchor="middle">one block, tagged</text><path class="edge-purple" d="M420 289 C 500 289, 500 163, 584 163" marker-end="url(#a-purple)"/><text class="big t-green" x="590" y="232" text-anchor="start">4</text><text class="b" x="614" y="232" text-anchor="start">a bin runs dry: one swap takes all</text><text class="small muted" x="614" y="252" text-anchor="start">the chunk map gives each block’s class</text><rect class="green" x="614" y="266" width="28" height="26" rx="4"/><text class="mono small" x="628" y="284" text-anchor="middle">p</text><rect class="green" x="648" y="266" width="28" height="26" rx="4"/><text class="mono small" x="662" y="284" text-anchor="middle">p</text><rect class="green" x="682" y="266" width="28" height="26" rx="4"/><text class="mono small" x="696" y="284" text-anchor="middle">p</text><rect class="green" x="716" y="266" width="28" height="26" rx="4"/><text class="mono small" x="730" y="284" text-anchor="middle">p</text><rect class="green" x="750" y="266" width="28" height="26" rx="4"/><text class="mono small" x="764" y="284" text-anchor="middle">p</text><rect class="green" x="784" y="266" width="28" height="26" rx="4"/><text class="mono small" x="798" y="284" text-anchor="middle">p</text><rect class="green" x="818" y="266" width="28" height="26" rx="4"/><text class="mono small" x="832" y="284" text-anchor="middle">p</text><rect class="green" x="852" y="266" width="28" height="26" rx="4"/><text class="mono small" x="866" y="284" text-anchor="middle">p</text><rect class="green" x="886" y="266" width="28" height="26" rx="4"/><text class="mono small" x="900" y="284" text-anchor="middle">p</text><text class="small muted" x="614" y="318" text-anchor="start">Pointers go into the bins, or into their slab</text><text class="small muted" x="614" y="336" text-anchor="start">if the bin is full. The message is then freed</text><text class="small muted" x="614" y="354" text-anchor="start">like any other block.</text><rect class="panel" x="40" y="392" width="900" height="150" rx="8"/><text class="h" x="60" y="418" text-anchor="start">why this way</text><text class="small" x="60" y="442" text-anchor="start">A list threaded through the freed blocks would make the consumer write into each block, whose line sits in the</text><text class="small" x="60" y="460" text-anchor="start">producer’s cache, and the producer would then read each block to find the next. Here only the message moves.</text><text class="small" x="60" y="490" text-anchor="start">Blocks that fill whole cache lines skip all of this. The consumer keeps them in its own bin and hands them out again,</text><text class="small" x="60" y="508" text-anchor="start">because they cannot share a line with a block the producer still uses.</text></svg>