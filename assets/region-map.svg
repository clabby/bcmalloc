<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-label="A memory map of the reservation with its header, heap slots, bin slots, slab descriptors, chunk map, bitmaps and chunks, and the arithmetic from a pointer to its metadata"><title>A memory map of the reservation with its header, heap slots, bin slots, slab descriptors, chunk map, bitmaps and chunks, and the arithmetic from a pointer to its metadata</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start">The reservation</text><text class="small muted" x="40" y="54" text-anchor="start">Metadata sits next to the memory it describes and never inside it. All of it starts out as zeros.</text><rect class="gray" x="40" y="80" width="60" height="62" rx="4"/><text class="small b" x="70.0" y="107" text-anchor="middle">Region</text><text class="small b" x="70.0" y="123" text-anchor="middle">header</text><rect class="blue" x="100" y="80" width="80" height="62" rx="4"/><text class="small b" x="140.0" y="107" text-anchor="middle">heap</text><text class="small b" x="140.0" y="123" text-anchor="middle">slots</text><text class="small muted" x="140.0" y="162" text-anchor="middle">one per</text><text class="small muted" x="140.0" y="178" text-anchor="middle">heap</text><rect class="green" x="180" y="80" width="80" height="62" rx="4"/><text class="small b" x="220.0" y="107" text-anchor="middle">bin</text><text class="small b" x="220.0" y="123" text-anchor="middle">slots</text><text class="small muted" x="220.0" y="162" text-anchor="middle">36,000 pointers</text><text class="small muted" x="220.0" y="178" text-anchor="middle">per heap</text><rect class="orange" x="260" y="80" width="96" height="62" rx="4"/><text class="small b" x="308.0" y="107" text-anchor="middle">slab</text><text class="small b" x="308.0" y="123" text-anchor="middle">descriptors</text><text class="small muted" x="308.0" y="162" text-anchor="middle">640 B</text><text class="small muted" x="308.0" y="178" text-anchor="middle">per chunk</text><rect class="purple" x="356" y="80" width="76" height="62" rx="4"/><text class="small b" x="394.0" y="107" text-anchor="middle">chunk</text><text class="small b" x="394.0" y="123" text-anchor="middle">map</text><text class="small muted" x="394.0" y="162" text-anchor="middle">8 B</text><text class="small muted" x="394.0" y="178" text-anchor="middle">per chunk</text><rect class="yellow" x="432" y="80" width="70" height="62" rx="4"/><text class="small b" x="467.0" y="115" text-anchor="middle">bitmaps</text><text class="small muted" x="467.0" y="162" text-anchor="middle">4 bits</text><text class="small muted" x="467.0" y="178" text-anchor="middle">per chunk</text><rect class="gray" x="502" y="80" width="40" height="62" rx="4"/><text class="small b" x="522.0" y="115" text-anchor="middle">pad</text><text class="small muted" x="522.0" y="162" text-anchor="middle">to 4 MiB</text><rect class="free" x="542" y="80" width="398" height="62" rx="4"/><text class="small b" x="741.0" y="115" text-anchor="middle">chunks, the memory that is handed out</text><text class="small muted" x="741.0" y="162" text-anchor="middle">64 KiB each, aligned to 4 MiB</text><path class="edge" d="M40 196 L40 204 L540 204 L540 196"/><text class="small" x="290" y="222" text-anchor="middle">metadata, about 1% of the region</text><path class="edge" d="M542 196 L542 204 L938 204 L938 196"/><text class="small" x="740" y="222" text-anchor="middle">the other 99%</text><rect class="panel" x="40" y="246" width="900" height="236" rx="8"/><text class="h" x="60" y="272" text-anchor="start">from a pointer to its metadata</text><text class="small muted" x="60" y="294" text-anchor="start">No header is read from the block. A subtraction and a shift find the chunk, and its chunk map entry says who owns it and what it is.</text><rect class="blue" x="60" y="312" width="196" height="80" rx="6"/><text class="small b" x="72" y="336" text-anchor="start">pointer</text><text class="mono small" x="72" y="358" text-anchor="start">base + 0x2A_3F10</text><path class="edge" d="M256 352 L276 352" marker-end="url(#a-muted)"/><rect class="gray" x="278" y="312" width="196" height="80" rx="6"/><text class="small b" x="290" y="336" text-anchor="start">chunk index</text><text class="mono small" x="290" y="358" text-anchor="start">(ptr - base) &gt;&gt; 16</text><text class="mono small" x="290" y="378" text-anchor="start">= 42</text><path class="edge" d="M474 352 L494 352" marker-end="url(#a-muted)"/><rect class="purple" x="496" y="312" width="196" height="80" rx="6"/><text class="small b" x="508" y="336" text-anchor="start">chunk map entry</text><text class="mono small" x="508" y="358" text-anchor="start">map[42]</text><text class="mono small" x="508" y="378" text-anchor="start">= heap 3, class 30</text><path class="edge" d="M692 352 L712 352" marker-end="url(#a-muted)"/><rect class="orange" x="714" y="312" width="196" height="80" rx="6"/><text class="small b" x="726" y="336" text-anchor="start">descriptor</text><text class="mono small" x="726" y="358" text-anchor="start">slabs[42 &amp; !7]</text><text class="mono small" x="726" y="378" text-anchor="start">= slabs[40]</text><text class="small" x="60" y="422" text-anchor="start">A free needs only the entry. The owner says whether the block is this heap’s, and the bin offset next to the class says where it goes.</text><text class="small" x="60" y="440" text-anchor="start">The descriptor is only read by the owning heap, when blocks go back to their slab. Its slab here spans 8 chunks, and masking</text><text class="small" x="60" y="458" text-anchor="start">works because every slab starts at a multiple of its own length in chunks.</text></svg>