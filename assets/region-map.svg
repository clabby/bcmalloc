<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-label="Layout of the reservation and how a pointer finds its slab descriptor"><title>Layout of the reservation and how a pointer finds its slab descriptor</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start" >The reservation</text><text class="small muted" x="40" y="54" text-anchor="start" >Metadata sits next to the memory it describes and never inside it. All of it starts out as zeros.</text><rect class="gray" x="40" y="112" width="70" height="58" rx="0" /><text class="small b" x="75" y="137" text-anchor="middle" >Region</text><text class="small muted" x="75" y="154" text-anchor="middle" >header</text><rect class="blue" x="110" y="112" width="120" height="58" rx="0" /><text class="small b" x="170" y="137" text-anchor="middle" >heap slots</text><text class="small muted" x="170" y="154" text-anchor="middle" >1.7 KiB each</text><rect class="purple" x="230" y="112" width="170" height="58" rx="0" /><text class="small b" x="315" y="137" text-anchor="middle" >slab descriptors</text><text class="small muted" x="315" y="154" text-anchor="middle" >128 B per chunk</text><rect class="orange" x="400" y="112" width="84" height="58" rx="0" /><text class="small b" x="442" y="137" text-anchor="middle" >bitmap</text><text class="small muted" x="442" y="154" text-anchor="middle" >1 bit per chunk</text><rect class="yellow" x="484" y="112" width="56" height="58" rx="0" /><text class="small b" x="512" y="137" text-anchor="middle" >pad</text><text class="small muted" x="512" y="154" text-anchor="middle" >to 4 MiB</text><rect class="green" x="540" y="112" width="400" height="58" rx="0" /><text class="b" x="740" y="137" text-anchor="middle" >chunks, the memory that is handed out</text><text class="small muted" x="740" y="155" text-anchor="middle" >64 KiB each, aligned to 4 MiB</text><path class="edge" d="M40 104 L40 98 L536 98 L536 104" /><text class="small muted" x="288" y="88" text-anchor="middle" >metadata, about 0.2% of the region</text><path class="edge" d="M544 104 L544 98 L940 98 L940 104" /><text class="small muted" x="742" y="88" text-anchor="middle" >the other 99.8%</text><path class="edge dash" d="M540 170 L106 244 M940 170 L810 244" /><rect class="blue" x="106" y="250" width="22" height="40" rx="2" /><rect class="green" x="128" y="250" width="22" height="40" rx="2" /><rect class="purple" x="150" y="250" width="22" height="40" rx="2" /><rect class="free" x="172" y="250" width="22" height="40" rx="2" /><rect class="free" x="194" y="250" width="22" height="40" rx="2" /><rect class="free" x="216" y="250" width="22" height="40" rx="2" /><rect class="free" x="238" y="250" width="22" height="40" rx="2" /><rect class="free" x="260" y="250" width="22" height="40" rx="2" /><rect class="orange" x="282" y="250" width="22" height="40" rx="2" /><rect class="orange" x="304" y="250" width="22" height="40" rx="2" /><rect class="orange" x="326" y="250" width="22" height="40" rx="2" /><rect class="orange" x="348" y="250" width="22" height="40" rx="2" /><rect class="orange" x="370" y="250" width="22" height="40" rx="2" /><rect class="orange" x="392" y="250" width="22" height="40" rx="2" /><rect class="orange" x="414" y="250" width="22" height="40" rx="2" /><rect class="orange" x="436" y="250" width="22" height="40" rx="2" /><rect class="blue" x="458" y="250" width="22" height="40" rx="2" /><rect class="free" x="480" y="250" width="22" height="40" rx="2" /><rect class="green" x="502" y="250" width="22" height="40" rx="2" /><rect class="free" x="524" y="250" width="22" height="40" rx="2" /><rect class="free" x="546" y="250" width="22" height="40" rx="2" /><rect class="free" x="568" y="250" width="22" height="40" rx="2" /><rect class="free" x="590" y="250" width="22" height="40" rx="2" /><rect class="free" x="612" y="250" width="22" height="40" rx="2" /><rect class="purple" x="634" y="250" width="22" height="40" rx="2" /><rect class="purple" x="656" y="250" width="22" height="40" rx="2" /><rect class="purple" x="678" y="250" width="22" height="40" rx="2" /><rect class="purple" x="700" y="250" width="22" height="40" rx="2" /><rect class="purple" x="722" y="250" width="22" height="40" rx="2" /><rect class="purple" x="744" y="250" width="22" height="40" rx="2" /><rect class="purple" x="766" y="250" width="22" height="40" rx="2" /><rect class="purple" x="788" y="250" width="22" height="40" rx="2" /><path class="edge" d="M106 290 L106 300" /><text class="mono small muted" x="106" y="316" text-anchor="middle" >chunk 0</text><path class="edge" d="M282 290 L282 300" /><text class="mono small muted" x="282" y="316" text-anchor="middle" >chunk 8</text><path class="edge" d="M458 290 L458 300" /><text class="mono small muted" x="458" y="316" text-anchor="middle" >chunk 16</text><path class="edge" d="M634 290 L634 300" /><text class="mono small muted" x="634" y="316" text-anchor="middle" >chunk 24</text><path class="edge" d="M810 290 L810 300" /><text class="mono small muted" x="810" y="316" text-anchor="middle" >...</text><text class="small b t-orange" x="370" y="238" text-anchor="middle" >a slab of 8 chunks, starting at chunk 8</text><text class="small b t-purple" x="722" y="238" text-anchor="middle" >another slab of 8</text><text class="small muted" x="830" y="268" text-anchor="start" >single chunks are slabs</text><text class="small muted" x="830" y="284" text-anchor="start" >for small blocks</text><text class="small muted" x="106" y="346" text-anchor="start" >The chunks above, zoomed in. A slab always starts at a multiple of its own length in chunks.</text><text class="title" x="40" y="392" text-anchor="start" >Finding a descriptor from a pointer</text><text class="small muted" x="40" y="412" text-anchor="start" >No header is read from the block. The layout that the caller passes to free gives the size class, and arithmetic does the rest.</text><rect class="gray" x="40" y="436" width="188" height="66" rx="10" /><text class="b small" x="134" y="462" text-anchor="middle" >pointer</text><text class="mono small" x="134" y="484" text-anchor="middle" >base + 0x2A_3F10</text><path class="edge " d="M234 469 L274 469" marker-end="url(#a-muted)" /><rect class="blue" x="280" y="436" width="188" height="66" rx="10" /><text class="b small" x="374" y="462" text-anchor="middle" >chunk index</text><text class="mono small" x="374" y="484" text-anchor="middle" >(ptr - base) &gt;&gt; 16 = 42</text><path class="edge " d="M474 469 L514 469" marker-end="url(#a-muted)" /><rect class="orange" x="520" y="436" width="188" height="66" rx="10" /><text class="b small" x="614" y="462" text-anchor="middle" >first chunk of the slab</text><text class="mono small" x="614" y="484" text-anchor="middle" >42 &amp; !(8 - 1) = 40</text><path class="edge " d="M714 469 L754 469" marker-end="url(#a-muted)" /><rect class="purple" x="760" y="436" width="188" height="66" rx="10" /><text class="b small" x="854" y="462" text-anchor="middle" >descriptor</text><text class="mono small" x="854" y="484" text-anchor="middle" >slabs[40]</text><text class="small muted" x="40" y="528" text-anchor="start" >The example uses a class whose slabs span 8 chunks. Masking works because every slab starts at a multiple of its own length in chunks.</text></svg>
