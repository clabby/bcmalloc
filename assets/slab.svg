<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="A slab of blocks and its descriptor, with the free bitmap, the counters and the list links"><title>A slab of blocks and its descriptor, with the free bitmap, the counters and the list links</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start">Anatomy of a slab</text><text class="small muted" x="40" y="54" text-anchor="start">A slab holds blocks of one size. Its descriptor sits outside it, and a bitmap there says which blocks are free.</text><text class="h" x="60" y="120" text-anchor="start">slab</text><text class="small muted" x="60" y="138" text-anchor="start">64 KiB</text><rect class="blue" x="170" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="190.5" y="124" text-anchor="middle">0</text><rect class="green" x="217" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="237.5" y="124" text-anchor="middle">1</text><rect class="free" x="264" y="100" width="41" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="284.5" y="124" text-anchor="middle">2</text><rect class="blue" x="311" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="331.5" y="124" text-anchor="middle">3</text><rect class="purple" x="358" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="378.5" y="124" text-anchor="middle">4</text><rect class="blue" x="405" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="425.5" y="124" text-anchor="middle">5</text><rect class="free" x="452" y="100" width="41" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="472.5" y="124" text-anchor="middle">6</text><rect class="free" x="499" y="100" width="41" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="519.5" y="124" text-anchor="middle">7</text><rect class="green" x="546" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="566.5" y="124" text-anchor="middle">8</text><rect class="blue" x="593" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="613.5" y="124" text-anchor="middle">9</text><rect class="blue" x="640" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="660.5" y="124" text-anchor="middle">10</text><rect class="free" x="687" y="100" width="41" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="707.5" y="124" text-anchor="middle">11</text><rect class="blue" x="734" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="754.5" y="124" text-anchor="middle">12</text><rect class="purple" x="781" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="801.5" y="124" text-anchor="middle">13</text><rect class="free" x="828" y="100" width="41" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="848.5" y="124" text-anchor="middle">14</text><rect class="blue" x="875" y="100" width="41" height="40" rx="5"/><text class="mono small muted" x="895.5" y="124" text-anchor="middle">15</text><rect class="blue" x="176" y="160" width="14" height="14" rx="3"/><text class="small" x="196" y="172" text-anchor="start">in the program’s hands</text><rect class="green" x="361" y="160" width="14" height="14" rx="3"/><text class="small" x="381" y="172" text-anchor="start">in a heap’s bin</text><rect class="purple" x="511" y="160" width="14" height="14" rx="3"/><text class="small" x="531" y="172" text-anchor="start">in a message on its way home</text><rect class="free" x="741" y="160" width="14" height="14" rx="3" style="stroke-dasharray:3 2"/><text class="small" x="761" y="172" text-anchor="start">free</text><text class="small muted" x="176" y="200" text-anchor="start">A block whose bit is clear counts as in use, wherever it is. The slab goes back to the chunk bitmap when every bit is set.</text><rect class="panel" x="40" y="222" width="900" height="238" rx="8"/><text class="h" x="60" y="248" text-anchor="start">descriptor, which only the owning heap touches</text><text class="b" x="60" y="286" text-anchor="start">free bitmap</text><text class="small muted" x="60" y="302" text-anchor="start">a bit per block</text><rect class="gray" x="170" y="270" width="41" height="32" rx="5"/><text class="mono b" x="190.5" y="291" text-anchor="middle">0</text><rect class="gray" x="217" y="270" width="41" height="32" rx="5"/><text class="mono b" x="237.5" y="291" text-anchor="middle">0</text><rect class="green" x="264" y="270" width="41" height="32" rx="5"/><text class="mono b" x="284.5" y="291" text-anchor="middle">1</text><rect class="gray" x="311" y="270" width="41" height="32" rx="5"/><text class="mono b" x="331.5" y="291" text-anchor="middle">0</text><rect class="gray" x="358" y="270" width="41" height="32" rx="5"/><text class="mono b" x="378.5" y="291" text-anchor="middle">0</text><rect class="gray" x="405" y="270" width="41" height="32" rx="5"/><text class="mono b" x="425.5" y="291" text-anchor="middle">0</text><rect class="green" x="452" y="270" width="41" height="32" rx="5"/><text class="mono b" x="472.5" y="291" text-anchor="middle">1</text><rect class="green" x="499" y="270" width="41" height="32" rx="5"/><text class="mono b" x="519.5" y="291" text-anchor="middle">1</text><rect class="gray" x="546" y="270" width="41" height="32" rx="5"/><text class="mono b" x="566.5" y="291" text-anchor="middle">0</text><rect class="gray" x="593" y="270" width="41" height="32" rx="5"/><text class="mono b" x="613.5" y="291" text-anchor="middle">0</text><rect class="gray" x="640" y="270" width="41" height="32" rx="5"/><text class="mono b" x="660.5" y="291" text-anchor="middle">0</text><rect class="green" x="687" y="270" width="41" height="32" rx="5"/><text class="mono b" x="707.5" y="291" text-anchor="middle">1</text><rect class="gray" x="734" y="270" width="41" height="32" rx="5"/><text class="mono b" x="754.5" y="291" text-anchor="middle">0</text><rect class="gray" x="781" y="270" width="41" height="32" rx="5"/><text class="mono b" x="801.5" y="291" text-anchor="middle">0</text><rect class="green" x="828" y="270" width="41" height="32" rx="5"/><text class="mono b" x="848.5" y="291" text-anchor="middle">1</text><rect class="gray" x="875" y="270" width="41" height="32" rx="5"/><text class="mono b" x="895.5" y="291" text-anchor="middle">0</text><rect class="free" x="60" y="324" width="164" height="56" rx="6"/><text class="mono b" x="72" y="347" text-anchor="start">free_len = 5</text><text class="small muted" x="72" y="367" text-anchor="start">blocks whose bit is set</text><rect class="free" x="234" y="324" width="164" height="56" rx="6"/><text class="mono b" x="246" y="347" text-anchor="start">capacity = 16</text><text class="small muted" x="246" y="367" text-anchor="start">blocks in the slab</text><rect class="free" x="408" y="324" width="164" height="56" rx="6"/><text class="mono b" x="420" y="347" text-anchor="start">cursor</text><text class="small muted" x="420" y="367" text-anchor="start">lowest word with a set bit</text><rect class="free" x="582" y="324" width="164" height="56" rx="6"/><text class="mono b" x="594" y="347" text-anchor="start">class, start</text><text class="small muted" x="594" y="367" text-anchor="start">what the blocks are, where</text><rect class="free" x="756" y="324" width="164" height="56" rx="6"/><text class="mono b" x="768" y="347" text-anchor="start">next, prev</text><text class="small muted" x="768" y="367" text-anchor="start">links in the slab lists</text><text class="small" x="60" y="414" text-anchor="start">A refill takes set bits a word at a time, lowest first, and clears them. A free sets one. Neither reads or writes</text><text class="small" x="60" y="432" text-anchor="start">the block, so a free into cold memory costs a bit and not a cache miss, and a refill hands blocks out in address order.</text></svg>