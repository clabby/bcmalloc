<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-label="A slab, its three free lists and its descriptor"><title>A slab, its three free lists and its descriptor</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start" >Anatomy of a slab</text><text class="small muted" x="40" y="54" text-anchor="start" >A slab holds blocks of one size. Every free block is on exactly one of three lists, or has never been used.</text><rect class="blue" x="120" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="142" y="174" text-anchor="middle" >0</text><rect class="blue" x="170" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="192" y="174" text-anchor="middle" >1</text><rect class="green" x="220" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="242" y="174" text-anchor="middle" >2</text><rect class="orange" x="270" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="292" y="174" text-anchor="middle" >3</text><rect class="blue" x="320" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="342" y="174" text-anchor="middle" >4</text><rect class="orange" x="370" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="392" y="174" text-anchor="middle" >5</text><rect class="purple" x="420" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="442" y="174" text-anchor="middle" >6</text><rect class="blue" x="470" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="492" y="174" text-anchor="middle" >7</text><rect class="green" x="520" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="542" y="174" text-anchor="middle" >8</text><rect class="blue" x="570" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="592" y="174" text-anchor="middle" >9</text><rect class="blue" x="620" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="642" y="174" text-anchor="middle" >10</text><rect class="purple" x="670" y="150" width="44" height="40" rx="5" /><text class="mono small muted" x="692" y="174" text-anchor="middle" >11</text><rect class="free" x="720" y="150" width="44" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="742" y="174" text-anchor="middle" >12</text><rect class="free" x="770" y="150" width="44" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="792" y="174" text-anchor="middle" >13</text><rect class="free" x="820" y="150" width="44" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="842" y="174" text-anchor="middle" >14</text><rect class="free" x="870" y="150" width="44" height="40" rx="5" style="stroke-dasharray:4 3"/><text class="mono small muted" x="892" y="174" text-anchor="middle" >15</text><path class="edge-red dash" d="M717 124 L717 200" /><text class="small b t-red" x="724" y="114" text-anchor="start" >bumped = 12</text><text class="small muted" x="724" y="130" text-anchor="start" >untouched memory from here on</text><text class="mono b f-green" x="104" y="118" text-anchor="end" >free</text><path class="edge-green" d="M108 114 C 140 96, 238 96, 238 147" marker-end="url(#a-green)" /><path class="edge-green" d="M248 147 C 254 92, 530 92, 536 147" marker-end="url(#a-green)" /><path class="edge-green" d="M550 150 L550 136" /><path class="edge-green" d="M545 136 L555 136" /><text class="mono b f-orange" x="104" y="242" text-anchor="end" >local_free</text><path class="edge-orange" d="M108 238 C 160 254, 288 248, 288 193" marker-end="url(#a-orange)" /><path class="edge-orange" d="M298 193 C 304 264, 380 264, 386 193" marker-end="url(#a-orange)" /><path class="edge-orange" d="M400 190 L400 204" /><path class="edge-orange" d="M395 204 L405 204" /><text class="mono b f-purple" x="104" y="298" text-anchor="end" >remote</text><path class="edge-purple" d="M108 294 L700 294 L700 193" marker-end="url(#a-purple)" /><path class="edge-purple" d="M684 193 C 680 270, 456 270, 450 193" marker-end="url(#a-purple)" /><path class="edge-purple" d="M434 190 L434 204" /><path class="edge-purple" d="M429 204 L439 204" /><rect class="blue" x="120" y="330" width="18" height="14" rx="3" /><text class="small" x="146" y="342" text-anchor="start" >allocated</text><rect class="green" x="270" y="330" width="18" height="14" rx="3" /><text class="small" x="296" y="342" text-anchor="start" >on free</text><rect class="orange" x="420" y="330" width="18" height="14" rx="3" /><text class="small" x="446" y="342" text-anchor="start" >on local_free</text><rect class="purple" x="570" y="330" width="18" height="14" rx="3" /><text class="small" x="596" y="342" text-anchor="start" >on remote</text><rect class="free" x="720" y="330" width="18" height="14" rx="3" style="stroke-dasharray:3 2"/><text class="small" x="746" y="342" text-anchor="start" >never used</text><text class="small muted" x="870" y="342" text-anchor="start" >a bar ends a list</text><text class="title" x="40" y="370" text-anchor="start" >The descriptor sits outside the slab, on two 128 byte lines</text><rect class="panel" x="40" y="386" width="440" height="150" rx="12" /><text class="small b" x="56" y="408" text-anchor="start" >cache line 1, only the owning heap touches it</text><text class="mono small" x="56" y="432" text-anchor="start" >free</text><text class="small muted" x="266" y="432" text-anchor="start" >blocks for the next refill</text><text class="mono small" x="56" y="452" text-anchor="start" >local_free</text><text class="small muted" x="266" y="452" text-anchor="start" >blocks the owner freed</text><text class="mono small" x="56" y="472" text-anchor="start" >free_len, local_count, bumped</text><text class="small muted" x="266" y="472" text-anchor="start" >how long each list is</text><text class="mono small" x="56" y="492" text-anchor="start" >class, start</text><text class="small muted" x="266" y="492" text-anchor="start" >what the blocks are and where</text><text class="mono small" x="56" y="512" text-anchor="start" >next, prev, list</text><text class="small muted" x="266" y="512" text-anchor="start" >links in the heap lists</text><rect class="panel" x="500" y="386" width="440" height="150" rx="12" /><text class="small b" x="516" y="408" text-anchor="start" >cache line 2, any thread may touch it</text><rect class="purple" x="516" y="422" width="236" height="30" rx="5" /><text class="small" x="634" y="442" text-anchor="middle" >newest remote block</text><rect class="red" x="752" y="422" width="74" height="30" rx="5" /><text class="mono small" x="789" y="442" text-anchor="middle" >QUEUED</text><rect class="orange" x="826" y="422" width="56" height="30" rx="5" /><text class="mono small" x="854" y="442" text-anchor="middle" >FULL</text><text class="mono small" x="516" y="478" text-anchor="start" >remote</text><text class="small muted" x="646" y="478" text-anchor="start" >one atomic word, with the flags in its low bits</text><text class="mono small" x="516" y="498" text-anchor="start" >owner, notified</text><text class="small muted" x="646" y="498" text-anchor="start" >heap id, and the link in the unfull stack</text></svg>
