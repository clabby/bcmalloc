<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 498" width="980" height="498" role="img" aria-label="A slab that empties returns its chunks to a shared bitmap and can be reused by any size class"><title>A slab that empties returns its chunks to a shared bitmap and can be reused by any size class</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start" >Memory freed by one size class serves any other</text><text class="small muted" x="40" y="54" text-anchor="start" >Slabs are uniform runs of chunks, so a slab that empties goes back to the shared pool and can become anything.</text><text class="b" x="40" y="98" text-anchor="start" >1. A burst of 64 B blocks (blue) and 4 KiB blocks (green)</text><rect class="blue" x="40" y="112" width="33" height="44" rx="3" /><rect class="blue" x="73" y="112" width="33" height="44" rx="3" /><rect class="blue" x="106" y="112" width="33" height="44" rx="3" /><rect class="blue" x="139" y="112" width="33" height="44" rx="3" /><rect class="green" x="172" y="112" width="33" height="44" rx="3" /><rect class="green" x="205" y="112" width="33" height="44" rx="3" /><rect class="blue" x="238" y="112" width="33" height="44" rx="3" /><rect class="blue" x="271" y="112" width="33" height="44" rx="3" /><rect class="blue" x="304" y="112" width="33" height="44" rx="3" /><rect class="blue" x="337" y="112" width="33" height="44" rx="3" /><rect class="blue" x="370" y="112" width="33" height="44" rx="3" /><rect class="green" x="403" y="112" width="33" height="44" rx="3" /><rect class="green" x="436" y="112" width="33" height="44" rx="3" /><rect class="green" x="469" y="112" width="33" height="44" rx="3" /><rect class="blue" x="502" y="112" width="33" height="44" rx="3" /><rect class="blue" x="535" y="112" width="33" height="44" rx="3" /><rect class="blue" x="568" y="112" width="33" height="44" rx="3" /><rect class="blue" x="601" y="112" width="33" height="44" rx="3" /><rect class="blue" x="634" y="112" width="33" height="44" rx="3" /><rect class="blue" x="667" y="112" width="33" height="44" rx="3" /><rect class="blue" x="700" y="112" width="33" height="44" rx="3" /><rect class="blue" x="733" y="112" width="33" height="44" rx="3" /><rect class="blue" x="766" y="112" width="33" height="44" rx="3" /><rect class="blue" x="799" y="112" width="33" height="44" rx="3" /><rect class="blue" x="832" y="112" width="33" height="44" rx="3" /><rect class="blue" x="865" y="112" width="33" height="44" rx="3" /><rect class="blue" x="898" y="112" width="33" height="44" rx="3" /><rect class="blue" x="931" y="112" width="33" height="44" rx="3" /><text class="small muted" x="40" y="178" text-anchor="start" >Every square is one 64 KiB chunk.</text><text class="b" x="40" y="218" text-anchor="start" >2. The 64 B blocks die and their slabs empty out</text><rect class="free" x="40" y="232" width="33" height="44" rx="3" /><rect class="free" x="73" y="232" width="33" height="44" rx="3" /><rect class="free" x="106" y="232" width="33" height="44" rx="3" /><rect class="free" x="139" y="232" width="33" height="44" rx="3" /><rect class="green" x="172" y="232" width="33" height="44" rx="3" /><rect class="green" x="205" y="232" width="33" height="44" rx="3" /><rect class="free" x="238" y="232" width="33" height="44" rx="3" /><rect class="free" x="271" y="232" width="33" height="44" rx="3" /><rect class="free" x="304" y="232" width="33" height="44" rx="3" /><rect class="free" x="337" y="232" width="33" height="44" rx="3" /><rect class="free" x="370" y="232" width="33" height="44" rx="3" /><rect class="green" x="403" y="232" width="33" height="44" rx="3" /><rect class="green" x="436" y="232" width="33" height="44" rx="3" /><rect class="green" x="469" y="232" width="33" height="44" rx="3" /><rect class="free" x="502" y="232" width="33" height="44" rx="3" /><rect class="free" x="535" y="232" width="33" height="44" rx="3" /><rect class="free" x="568" y="232" width="33" height="44" rx="3" /><rect class="free" x="601" y="232" width="33" height="44" rx="3" /><rect class="free" x="634" y="232" width="33" height="44" rx="3" /><rect class="free" x="667" y="232" width="33" height="44" rx="3" /><rect class="free" x="700" y="232" width="33" height="44" rx="3" /><rect class="free" x="733" y="232" width="33" height="44" rx="3" /><rect class="free" x="766" y="232" width="33" height="44" rx="3" /><rect class="free" x="799" y="232" width="33" height="44" rx="3" /><rect class="free" x="832" y="232" width="33" height="44" rx="3" /><rect class="free" x="865" y="232" width="33" height="44" rx="3" /><rect class="free" x="898" y="232" width="33" height="44" rx="3" /><rect class="free" x="931" y="232" width="33" height="44" rx="3" /><text class="small muted" x="40" y="298" text-anchor="start" >Each empty slab clears its bit in the chunk bitmap. The 4 KiB slabs stay because their blocks are still in use.</text><text class="b" x="40" y="338" text-anchor="start" >3. The freed chunks are reused by other classes</text><rect class="orange" x="40" y="352" width="33" height="44" rx="3" /><rect class="orange" x="73" y="352" width="33" height="44" rx="3" /><rect class="orange" x="106" y="352" width="33" height="44" rx="3" /><rect class="orange" x="139" y="352" width="33" height="44" rx="3" /><rect class="green" x="172" y="352" width="33" height="44" rx="3" /><rect class="green" x="205" y="352" width="33" height="44" rx="3" /><rect class="orange" x="238" y="352" width="33" height="44" rx="3" /><rect class="orange" x="271" y="352" width="33" height="44" rx="3" /><rect class="orange" x="304" y="352" width="33" height="44" rx="3" /><rect class="orange" x="337" y="352" width="33" height="44" rx="3" /><rect class="orange" x="370" y="352" width="33" height="44" rx="3" /><rect class="green" x="403" y="352" width="33" height="44" rx="3" /><rect class="green" x="436" y="352" width="33" height="44" rx="3" /><rect class="green" x="469" y="352" width="33" height="44" rx="3" /><rect class="free" x="502" y="352" width="33" height="44" rx="3" /><rect class="free" x="535" y="352" width="33" height="44" rx="3" /><rect class="purple" x="568" y="352" width="33" height="44" rx="3" /><rect class="purple" x="601" y="352" width="33" height="44" rx="3" /><rect class="purple" x="634" y="352" width="33" height="44" rx="3" /><rect class="purple" x="667" y="352" width="33" height="44" rx="3" /><rect class="purple" x="700" y="352" width="33" height="44" rx="3" /><rect class="purple" x="733" y="352" width="33" height="44" rx="3" /><rect class="purple" x="766" y="352" width="33" height="44" rx="3" /><rect class="purple" x="799" y="352" width="33" height="44" rx="3" /><rect class="free" x="832" y="352" width="33" height="44" rx="3" /><rect class="free" x="865" y="352" width="33" height="44" rx="3" /><rect class="free" x="898" y="352" width="33" height="44" rx="3" /><rect class="free" x="931" y="352" width="33" height="44" rx="3" /><text class="small muted" x="40" y="418" text-anchor="start" >Orange slabs hold 256 B blocks. The purple slab spans 8 chunks for 32 KiB blocks and starts at chunk 16, a multiple of 8.</text><text class="small muted" x="40" y="452" text-anchor="start" >A design with a free list per size class cannot do this. A freed 64 byte block cannot serve a 4 KiB request, so the memory sits idle in the wrong list.</text><text class="small muted" x="40" y="472" text-anchor="start" >Here the only memory that is ever free for reuse is a whole slab, and any slab can become any class.</text></svg>
