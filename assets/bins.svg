<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-label="The bins of a heap as stacks of pointers, how a pop and a push work, and how a refill fills a bin from a slab bitmap"><title>The bins of a heap as stacks of pointers, how a pop and a push work, and how a refill fills a bin from a slab bitmap</title><style>
