.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start">A heap’s bins</text><text class="small muted" x="40" y="54" text-anchor="start">One stack of block pointers per size class. Allocating pops the top pointer and freeing pushes one. Neither touches the block.</text><rect class="panel" x="40" y="76" width="560" height="262" rx="8"/><text class="h" x="60" y="102" text-anchor="start">heap 3</text><text class="mono b" x="60" y="160" text-anchor="start">16 B</text><rect class="free" x="140" y="140" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="170" y="140" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="200" y="140" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="230" y="140" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="260" y="140" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="green" x="290" y="140" width="26" height="30" rx="4"/><text class="mono small" x="303" y="160" text-anchor="middle">p</text><rect class="green" x="320" y="140" width="26" height="30" rx="4"/><text class="mono small" x="333" y="160" text-anchor="middle">p</text><rect class="green" x="350" y="140" width="26" height="30" rx="4"/><text class="mono small" x="363" y="160" text-anchor="middle">p</text><rect class="green" x="380" y="140" width="26" height="30" rx="4"/><text class="mono small" x="393" y="160" text-anchor="middle">p</text><rect class="green" x="410" y="140" width="26" height="30" rx="4"/><text class="mono small" x="423" y="160" text-anchor="middle">p</text><rect class="green" x="440" y="140" width="26" height="30" rx="4"/><text class="mono small" x="453" y="160" text-anchor="middle">p</text><rect class="green" x="470" y="140" width="26" height="30" rx="4"/><text class="mono small" x="483" y="160" text-anchor="middle">p</text><rect class="green" x="500" y="140" width="26" height="30" rx="4"/><text class="mono small" x="513" y="160" text-anchor="middle">p</text><rect class="green" x="530" y="140" width="26" height="30" rx="4"/><text class="mono small" x="543" y="160" text-anchor="middle">p</text><text class="small t-green" x="303" y="124" text-anchor="middle">top</text><path class="edge-green" d="M303 128 L303 138" marker-end="url(#a-green)"/><text class="small muted" x="568" y="160" text-anchor="start">end</text><text class="mono b" x="60" y="224" text-anchor="start">48 B</text><rect class="free" x="140" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="170" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="200" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="230" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="260" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="290" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="320" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="350" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="380" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="410" y="204" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="green" x="440" y="204" width="26" height="30" rx="4"/><text class="mono small" x="453" y="224" text-anchor="middle">p</text><rect class="green" x="470" y="204" width="26" height="30" rx="4"/><text class="mono small" x="483" y="224" text-anchor="middle">p</text><rect class="green" x="500" y="204" width="26" height="30" rx="4"/><text class="mono small" x="513" y="224" text-anchor="middle">p</text><rect class="green" x="530" y="204" width="26" height="30" rx="4"/><text class="mono small" x="543" y="224" text-anchor="middle">p</text><text class="small t-green" x="453" y="188" text-anchor="middle">top</text><path class="edge-green" d="M453 192 L453 202" marker-end="url(#a-green)"/><text class="small muted" x="568" y="224" text-anchor="start">end</text><text class="mono b" x="60" y="288" text-anchor="start">1 KiB</text><rect class="free" x="140" y="268" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="free" x="170" y="268" width="26" height="30" rx="4" style="stroke-dasharray:3 2"/><rect class="green" x="200" y="268" width="26" height="30" rx="4"/><text class="mono small" x="213" y="288" text-anchor="middle">p</text><rect class="green" x="230" y="268" width="26" height="30" rx="4"/><text class="mono small" x="243" y="288" text-anchor="middle">p</text><rect class="green" x="260" y="268" width="26" height="30" rx="4"/><text class="mono small" x="273" y="288" text-anchor="middle">p</text><rect class="green" x="290" y="268" width="26" height="30" rx="4"/><text class="mono small" x="303" y="288" text-anchor="middle">p</text><rect class="green" x="320" y="268" width="26" height="30" rx="4"/><text class="mono small" x="333" y="288" text-anchor="middle">p</text><rect class="green" x="350" y="268" width="26" height="30" rx="4"/><text class="mono small" x="363" y="288" text-anchor="middle">p</text><rect class="green" x="380" y="268" width="26" height="30" rx="4"/><text class="mono small" x="393" y="288" text-anchor="middle">p</text><rect class="green" x="410" y="268" width="26" height="30" rx="4"/><text class="mono small" x="423" y="288" text-anchor="middle">p</text><rect class="green" x="440" y="268" width="26" height="30" rx="4"/><text class="mono small" x="453" y="288" text-anchor="middle">p</text><rect class="green" x="470" y="268" width="26" height="30" rx="4"/><text class="mono small" x="483" y="288" text-anchor="middle">p</text><rect class="green" x="500" y="268" width="26" height="30" rx="4"/><text class="mono small" x="513" y="288" text-anchor="middle">p</text><rect class="green" x="530" y="268" width="26" height="30" rx="4"/><text class="mono small" x="543" y="288" text-anchor="middle">p</text><text class="small t-green" x="213" y="252" text-anchor="middle">top</text><path class="edge-green" d="M213 256 L213 266" marker-end="url(#a-green)"/><text class="small muted" x="568" y="288" text-anchor="start">end</text><text class="small muted" x="60" y="326" text-anchor="start">Empty and full are a compare of the top pointer’s low bits with the bin’s two ends.</text><rect class="panel" x="620" y="76" width="320" height="124" rx="8"/><text class="h" x="640" y="102" text-anchor="start">the fast paths</text><text class="mono b" x="640" y="128" text-anchor="start">malloc</text><text class="small" x="710" y="128" text-anchor="start">class from a table, pop the top</text><text class="mono b" x="640" y="152" text-anchor="start">free</text><text class="small" x="710" y="152" text-anchor="start">owner and class from the chunk map,</text><text class="small" x="710" y="170" text-anchor="start">push on top</text><text class="small muted" x="640" y="190" text-anchor="start">no atomics, no stack frame, block untouched</text><rect class="panel" x="620" y="214" width="320" height="124" rx="8"/><text class="h" x="640" y="240" text-anchor="start">when a bin runs dry</text><rect class="green" x="640" y="252" width="24" height="26" rx="4"/><text class="mono small" x="652" y="270" text-anchor="middle">1</text><rect class="green" x="668" y="252" width="24" height="26" rx="4"/><text class="mono small" x="680" y="270" text-anchor="middle">1</text><rect class="gray" x="696" y="252" width="24" height="26" rx="4"/><text class="mono small" x="708" y="270" text-anchor="middle">0</text><rect class="green" x="724" y="252" width="24" height="26" rx="4"/><text class="mono small" x="736" y="270" text-anchor="middle">1</text><rect class="green" x="752" y="252" width="24" height="26" rx="4"/><text class="mono small" x="764" y="270" text-anchor="middle">1</text><rect class="green" x="780" y="252" width="24" height="26" rx="4"/><text class="mono small" x="792" y="270" text-anchor="middle">1</text><rect class="gray" x="808" y="252" width="24" height="26" rx="4"/><text class="mono small" x="820" y="270" text-anchor="middle">0</text><rect class="gray" x="836" y="252" width="24" height="26" rx="4"/><text class="mono small" x="848" y="270" text-anchor="middle">0</text><text class="small muted" x="870" y="270" text-anchor="start">slab</text><text class="small" x="640" y="300" text-anchor="start">set bits become pointers, lowest first,</text><text class="small" x="640" y="318" text-anchor="start">filling half the bin in address order</text><rect class="panel" x="40" y="352" width="900" height="148" rx="8"/><text class="h" x="60" y="378" text-anchor="start">when a bin is full</text><text class="small" x="60" y="402" text-anchor="start">The older half leaves the bin. Blocks of this heap go back to their slabs, a run of one slab with one write per bitmap word.</text><text class="small" x="60" y="420" text-anchor="start">Blocks of other heaps go to the outbox for their owner.</text><text class="h" x="60" y="452" text-anchor="start">sizing</text><text class="small" x="60" y="476" text-anchor="start">A bin that alternates between running dry and overflowing doubles, within 2 MiB for the whole heap.</text><text class="small" x="60" y="494" text-anchor="start">A bin that has not missed for a while is halved. Bursts stay in the bin, and quiet classes hold little.</text></svg>