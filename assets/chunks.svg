<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" role="img" aria-label="How the chunk bitmap claims a run of chunks"><title>How the chunk bitmap claims a run of chunks</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start" >Claiming chunks with one compare-and-swap</text><text class="small muted" x="40" y="54" text-anchor="start" >Each bitmap word covers 64 chunks. A run that fits in a word is claimed by flipping its bits in a single atomic step.</text><text class="b" x="40" y="96" text-anchor="start" >1. Find three free chunks in a row</text><text class="mono small muted" x="40" y="126" text-anchor="start" >bit of the word</text><text class="mono small muted" x="242" y="126" text-anchor="middle" >0</text><text class="mono small muted" x="338" y="126" text-anchor="middle" >4</text><text class="mono small muted" x="434" y="126" text-anchor="middle" >8</text><text class="mono small muted" x="530" y="126" text-anchor="middle" >12</text><text class="mono small muted" x="626" y="126" text-anchor="middle" >16</text><text class="mono small muted" x="722" y="126" text-anchor="middle" >20</text><text class="mono small muted" x="818" y="126" text-anchor="middle" >24</text><text class="mono small" x="40" y="154" text-anchor="start" >taken</text><rect class="blue" x="230" y="138" width="24" height="24" rx="3" /><rect class="blue" x="254" y="138" width="24" height="24" rx="3" /><rect class="free" x="278" y="138" width="24" height="24" rx="3" /><rect class="free" x="302" y="138" width="24" height="24" rx="3" /><rect class="blue" x="326" y="138" width="24" height="24" rx="3" /><rect class="free" x="350" y="138" width="24" height="24" rx="3" /><rect class="free" x="374" y="138" width="24" height="24" rx="3" /><rect class="free" x="398" y="138" width="24" height="24" rx="3" /><rect class="free" x="422" y="138" width="24" height="24" rx="3" /><rect class="blue" x="446" y="138" width="24" height="24" rx="3" /><rect class="free" x="470" y="138" width="24" height="24" rx="3" /><rect class="free" x="494" y="138" width="24" height="24" rx="3" /><rect class="blue" x="518" y="138" width="24" height="24" rx="3" /><rect class="blue" x="542" y="138" width="24" height="24" rx="3" /><rect class="free" x="566" y="138" width="24" height="24" rx="3" /><rect class="free" x="590" y="138" width="24" height="24" rx="3" /><rect class="free" x="614" y="138" width="24" height="24" rx="3" /><rect class="blue" x="638" y="138" width="24" height="24" rx="3" /><rect class="free" x="662" y="138" width="24" height="24" rx="3" /><rect class="free" x="686" y="138" width="24" height="24" rx="3" /><rect class="free" x="710" y="138" width="24" height="24" rx="3" /><rect class="free" x="734" y="138" width="24" height="24" rx="3" /><rect class="free" x="758" y="138" width="24" height="24" rx="3" /><rect class="free" x="782" y="138" width="24" height="24" rx="3" /><rect class="blue" x="806" y="138" width="24" height="24" rx="3" /><rect class="free" x="830" y="138" width="24" height="24" rx="3" /><rect class="free" x="854" y="138" width="24" height="24" rx="3" /><rect class="blue" x="878" y="138" width="24" height="24" rx="3" /><text class="mono small" x="40" y="186" text-anchor="start" >free</text><rect class="free" x="230" y="170" width="24" height="24" rx="3" /><rect class="free" x="254" y="170" width="24" height="24" rx="3" /><rect class="green" x="278" y="170" width="24" height="24" rx="3" /><rect class="green" x="302" y="170" width="24" height="24" rx="3" /><rect class="free" x="326" y="170" width="24" height="24" rx="3" /><rect class="green" x="350" y="170" width="24" height="24" rx="3" /><rect class="green" x="374" y="170" width="24" height="24" rx="3" /><rect class="green" x="398" y="170" width="24" height="24" rx="3" /><rect class="green" x="422" y="170" width="24" height="24" rx="3" /><rect class="free" x="446" y="170" width="24" height="24" rx="3" /><rect class="green" x="470" y="170" width="24" height="24" rx="3" /><rect class="green" x="494" y="170" width="24" height="24" rx="3" /><rect class="free" x="518" y="170" width="24" height="24" rx="3" /><rect class="free" x="542" y="170" width="24" height="24" rx="3" /><rect class="green" x="566" y="170" width="24" height="24" rx="3" /><rect class="green" x="590" y="170" width="24" height="24" rx="3" /><rect class="green" x="614" y="170" width="24" height="24" rx="3" /><rect class="free" x="638" y="170" width="24" height="24" rx="3" /><rect class="green" x="662" y="170" width="24" height="24" rx="3" /><rect class="green" x="686" y="170" width="24" height="24" rx="3" /><rect class="green" x="710" y="170" width="24" height="24" rx="3" /><rect class="green" x="734" y="170" width="24" height="24" rx="3" /><rect class="green" x="758" y="170" width="24" height="24" rx="3" /><rect class="green" x="782" y="170" width="24" height="24" rx="3" /><rect class="free" x="806" y="170" width="24" height="24" rx="3" /><rect class="green" x="830" y="170" width="24" height="24" rx="3" /><rect class="green" x="854" y="170" width="24" height="24" rx="3" /><rect class="free" x="878" y="170" width="24" height="24" rx="3" /><text class="b" x="40" y="234" text-anchor="start" >2. Fold the word onto itself until only run starts remain</text><text class="mono small f-orange" x="40" y="265" text-anchor="start" >starts &amp;= starts &gt;&gt; 1</text><rect class="free" x="230" y="248" width="24" height="24" rx="3" /><rect class="free" x="254" y="248" width="24" height="24" rx="3" /><rect class="orange" x="278" y="248" width="24" height="24" rx="3" /><rect class="free" x="302" y="248" width="24" height="24" rx="3" /><rect class="free" x="326" y="248" width="24" height="24" rx="3" /><rect class="orange" x="350" y="248" width="24" height="24" rx="3" /><rect class="orange" x="374" y="248" width="24" height="24" rx="3" /><rect class="orange" x="398" y="248" width="24" height="24" rx="3" /><rect class="free" x="422" y="248" width="24" height="24" rx="3" /><rect class="free" x="446" y="248" width="24" height="24" rx="3" /><rect class="orange" x="470" y="248" width="24" height="24" rx="3" /><rect class="free" x="494" y="248" width="24" height="24" rx="3" /><rect class="free" x="518" y="248" width="24" height="24" rx="3" /><rect class="free" x="542" y="248" width="24" height="24" rx="3" /><rect class="orange" x="566" y="248" width="24" height="24" rx="3" /><rect class="orange" x="590" y="248" width="24" height="24" rx="3" /><rect class="free" x="614" y="248" width="24" height="24" rx="3" /><rect class="free" x="638" y="248" width="24" height="24" rx="3" /><rect class="orange" x="662" y="248" width="24" height="24" rx="3" /><rect class="orange" x="686" y="248" width="24" height="24" rx="3" /><rect class="orange" x="710" y="248" width="24" height="24" rx="3" /><rect class="orange" x="734" y="248" width="24" height="24" rx="3" /><rect class="orange" x="758" y="248" width="24" height="24" rx="3" /><rect class="free" x="782" y="248" width="24" height="24" rx="3" /><rect class="free" x="806" y="248" width="24" height="24" rx="3" /><rect class="orange" x="830" y="248" width="24" height="24" rx="3" /><rect class="free" x="854" y="248" width="24" height="24" rx="3" /><rect class="free" x="878" y="248" width="24" height="24" rx="3" /><text class="mono small f-orange" x="40" y="297" text-anchor="start" >starts &amp;= starts &gt;&gt; 1</text><rect class="free" x="230" y="280" width="24" height="24" rx="3" /><rect class="free" x="254" y="280" width="24" height="24" rx="3" /><rect class="free" x="278" y="280" width="24" height="24" rx="3" /><rect class="free" x="302" y="280" width="24" height="24" rx="3" /><rect class="free" x="326" y="280" width="24" height="24" rx="3" /><rect class="orange" x="350" y="280" width="24" height="24" rx="3" /><rect class="orange" x="374" y="280" width="24" height="24" rx="3" /><rect class="free" x="398" y="280" width="24" height="24" rx="3" /><rect class="free" x="422" y="280" width="24" height="24" rx="3" /><rect class="free" x="446" y="280" width="24" height="24" rx="3" /><rect class="free" x="470" y="280" width="24" height="24" rx="3" /><rect class="free" x="494" y="280" width="24" height="24" rx="3" /><rect class="free" x="518" y="280" width="24" height="24" rx="3" /><rect class="free" x="542" y="280" width="24" height="24" rx="3" /><rect class="orange" x="566" y="280" width="24" height="24" rx="3" /><rect class="free" x="590" y="280" width="24" height="24" rx="3" /><rect class="free" x="614" y="280" width="24" height="24" rx="3" /><rect class="free" x="638" y="280" width="24" height="24" rx="3" /><rect class="orange" x="662" y="280" width="24" height="24" rx="3" /><rect class="orange" x="686" y="280" width="24" height="24" rx="3" /><rect class="orange" x="710" y="280" width="24" height="24" rx="3" /><rect class="orange" x="734" y="280" width="24" height="24" rx="3" /><rect class="free" x="758" y="280" width="24" height="24" rx="3" /><rect class="free" x="782" y="280" width="24" height="24" rx="3" /><rect class="free" x="806" y="280" width="24" height="24" rx="3" /><rect class="free" x="830" y="280" width="24" height="24" rx="3" /><rect class="free" x="854" y="280" width="24" height="24" rx="3" /><rect class="free" x="878" y="280" width="24" height="24" rx="3" /><text class="small muted" x="230" y="328" text-anchor="start" >Every remaining one is the first chunk of a run of three. The lowest one is chunk 5.</text><text class="b" x="40" y="362" text-anchor="start" >3. Claim the run with one compare-and-swap</text><text class="mono small" x="40" y="398" text-anchor="start" >seen</text><rect class="blue" x="230" y="382" width="24" height="24" rx="3" /><rect class="blue" x="254" y="382" width="24" height="24" rx="3" /><rect class="free" x="278" y="382" width="24" height="24" rx="3" /><rect class="free" x="302" y="382" width="24" height="24" rx="3" /><rect class="blue" x="326" y="382" width="24" height="24" rx="3" /><rect class="free" x="350" y="382" width="24" height="24" rx="3" /><rect class="free" x="374" y="382" width="24" height="24" rx="3" /><rect class="free" x="398" y="382" width="24" height="24" rx="3" /><rect class="free" x="422" y="382" width="24" height="24" rx="3" /><rect class="blue" x="446" y="382" width="24" height="24" rx="3" /><rect class="free" x="470" y="382" width="24" height="24" rx="3" /><rect class="free" x="494" y="382" width="24" height="24" rx="3" /><rect class="blue" x="518" y="382" width="24" height="24" rx="3" /><rect class="blue" x="542" y="382" width="24" height="24" rx="3" /><rect class="free" x="566" y="382" width="24" height="24" rx="3" /><rect class="free" x="590" y="382" width="24" height="24" rx="3" /><rect class="free" x="614" y="382" width="24" height="24" rx="3" /><rect class="blue" x="638" y="382" width="24" height="24" rx="3" /><rect class="free" x="662" y="382" width="24" height="24" rx="3" /><rect class="free" x="686" y="382" width="24" height="24" rx="3" /><rect class="free" x="710" y="382" width="24" height="24" rx="3" /><rect class="free" x="734" y="382" width="24" height="24" rx="3" /><rect class="free" x="758" y="382" width="24" height="24" rx="3" /><rect class="free" x="782" y="382" width="24" height="24" rx="3" /><rect class="blue" x="806" y="382" width="24" height="24" rx="3" /><rect class="free" x="830" y="382" width="24" height="24" rx="3" /><rect class="free" x="854" y="382" width="24" height="24" rx="3" /><rect class="blue" x="878" y="382" width="24" height="24" rx="3" /><text class="mono small" x="40" y="438" text-anchor="start" >new</text><rect class="blue" x="230" y="422" width="24" height="24" rx="3" /><rect class="blue" x="254" y="422" width="24" height="24" rx="3" /><rect class="free" x="278" y="422" width="24" height="24" rx="3" /><rect class="free" x="302" y="422" width="24" height="24" rx="3" /><rect class="blue" x="326" y="422" width="24" height="24" rx="3" /><rect class="green" x="350" y="422" width="24" height="24" rx="3" /><rect class="green" x="374" y="422" width="24" height="24" rx="3" /><rect class="green" x="398" y="422" width="24" height="24" rx="3" /><rect class="free" x="422" y="422" width="24" height="24" rx="3" /><rect class="blue" x="446" y="422" width="24" height="24" rx="3" /><rect class="free" x="470" y="422" width="24" height="24" rx="3" /><rect class="free" x="494" y="422" width="24" height="24" rx="3" /><rect class="blue" x="518" y="422" width="24" height="24" rx="3" /><rect class="blue" x="542" y="422" width="24" height="24" rx="3" /><rect class="free" x="566" y="422" width="24" height="24" rx="3" /><rect class="free" x="590" y="422" width="24" height="24" rx="3" /><rect class="free" x="614" y="422" width="24" height="24" rx="3" /><rect class="blue" x="638" y="422" width="24" height="24" rx="3" /><rect class="free" x="662" y="422" width="24" height="24" rx="3" /><rect class="free" x="686" y="422" width="24" height="24" rx="3" /><rect class="free" x="710" y="422" width="24" height="24" rx="3" /><rect class="free" x="734" y="422" width="24" height="24" rx="3" /><rect class="free" x="758" y="422" width="24" height="24" rx="3" /><rect class="free" x="782" y="422" width="24" height="24" rx="3" /><rect class="blue" x="806" y="422" width="24" height="24" rx="3" /><rect class="free" x="830" y="422" width="24" height="24" rx="3" /><rect class="free" x="854" y="422" width="24" height="24" rx="3" /><rect class="blue" x="878" y="422" width="24" height="24" rx="3" /><path class="edge-green " d="M386 408 L386 420" marker-end="url(#a-green)" /><text class="small muted" x="230" y="470" text-anchor="start" >The compare-and-swap succeeds only if the word still equals seen. If another thread changed it, we get the fresh word back and search it again.</text><text class="b" x="40" y="510" text-anchor="start" >4. Longer runs span words, so they claim one word at a time and roll back if they lose</text><rect class="green" x="40" y="530" width="190" height="54" rx="8" /><text class="small b" x="135" y="552" text-anchor="middle" >word 4</text><text class="small muted" x="135" y="570" text-anchor="middle" >all free</text><rect class="green" x="248" y="530" width="190" height="54" rx="8" /><text class="small b" x="343" y="552" text-anchor="middle" >word 5</text><text class="small muted" x="343" y="570" text-anchor="middle" >all free</text><rect class="red" x="456" y="530" width="190" height="54" rx="8" /><text class="small b" x="551" y="552" text-anchor="middle" >word 6</text><text class="small muted" x="551" y="570" text-anchor="middle" >one chunk taken</text><text class="small b" x="674" y="544" text-anchor="start" >a run of 130 chunks</text><text class="small" x="674" y="562" text-anchor="start" >claim words 4 and 5 with a CAS from zero,</text><text class="small t-red" x="674" y="578" text-anchor="start" >find word 6 taken, and release 4 and 5</text><text class="small muted" x="40" y="616" text-anchor="start" >We own the words we claimed, so the rollback is a plain store. This path is obstruction-free and only serves huge allocations.</text></svg>
