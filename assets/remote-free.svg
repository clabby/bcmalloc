<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 650" width="980" height="650" role="img" aria-label="Sequence of a remote free into a full slab"><title>Sequence of a remote free into a full slab</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start" >A remote free into a full slab</text><text class="small muted" x="40" y="54" text-anchor="start" >The owner and the freeing thread never talk directly. They meet in one atomic word, and each learns what it needs from the result of its own compare-and-swap.</text><text class="h" x="155" y="92" text-anchor="middle" >OWNER THREAD</text><text class="h" x="490" y="92" text-anchor="middle" >THE REMOTE WORD OF THE SLAB</text><text class="h" x="825" y="92" text-anchor="middle" >ANOTHER THREAD</text><path class="edge dash" d="M155 102 L155 586" style="stroke-opacity:.35"/><path class="edge dash" d="M490 102 L490 586" style="stroke-opacity:.35"/><path class="edge dash" d="M825 102 L825 586" style="stroke-opacity:.35"/><rect class="blue" x="40" y="112" width="230" height="74" rx="12" /><circle cx="58" cy="132" r="11" style="fill:var(--ink)"/><text x="58" y="136" text-anchor="middle" style="fill:var(--page);font-size:12px;font-weight:700">1</text><text class="b" x="78" y="137" text-anchor="start" >slab runs out of blocks</text><text class="mono small" x="58" y="164" text-anchor="start" >try_mark_full()</text><rect class="orange" x="375" y="112" width="230" height="74" rx="12" /><text class="b big" x="490" y="144" text-anchor="middle" >FULL</text><text class="small muted" x="490" y="166" text-anchor="middle" >the word was empty, now it says so</text><path class="edge-blue " d="M274 149 L371 149" marker-end="url(#a-blue)" /><rect class="green" x="710" y="244" width="230" height="74" rx="12" /><circle cx="728" cy="264" r="11" style="fill:var(--ink)"/><text x="728" y="268" text-anchor="middle" style="fill:var(--page);font-size:12px;font-weight:700">2</text><text class="b" x="748" y="269" text-anchor="start" >frees block A</text><text class="mono small" x="728" y="296" text-anchor="start" >push_remote(A) returns true</text><rect class="red" x="375" y="244" width="230" height="74" rx="12" /><text class="b big" x="490" y="276" text-anchor="middle" >A, QUEUED</text><text class="small muted" x="490" y="298" text-anchor="middle" >one CAS swapped FULL for QUEUED</text><path class="edge-green " d="M706 281 L609 281" marker-end="url(#a-green)" /><rect class="purple" x="40" y="248" width="230" height="66" rx="12" /><text class="b" x="58" y="274" text-anchor="start" >unfull stack</text><text class="mono small" x="58" y="296" text-anchor="start" >slab.enqueue(...)</text><path class="edge-purple dash" d="M825 322 C 825 362, 155 362, 155 316" marker-end="url(#a-purple)" /><text class="small b t-purple" x="490" y="372" text-anchor="middle" >the pusher that saw FULL tells the owner</text><rect class="green" x="710" y="376" width="230" height="74" rx="12" /><circle cx="728" cy="396" r="11" style="fill:var(--ink)"/><text x="728" y="400" text-anchor="middle" style="fill:var(--page);font-size:12px;font-weight:700">3</text><text class="b" x="748" y="401" text-anchor="start" >frees block B</text><text class="mono small" x="728" y="428" text-anchor="start" >push_remote(B) returns false</text><rect class="red" x="375" y="376" width="230" height="74" rx="12" /><text class="b big" x="490" y="408" text-anchor="middle" >B, A, QUEUED</text><text class="small muted" x="490" y="430" text-anchor="middle" >already queued, nobody is told again</text><path class="edge-green " d="M706 413 L609 413" marker-end="url(#a-green)" /><rect class="blue" x="40" y="508" width="230" height="74" rx="12" /><circle cx="58" cy="528" r="11" style="fill:var(--ink)"/><text x="58" y="532" text-anchor="middle" style="fill:var(--page);font-size:12px;font-weight:700">4</text><text class="b" x="78" y="533" text-anchor="start" >next slow path</text><text class="mono small" x="58" y="560" text-anchor="start" >drain_notified()</text><rect class="gray" x="375" y="508" width="230" height="74" rx="12" /><text class="b big" x="490" y="540" text-anchor="middle" >empty</text><text class="small muted" x="490" y="562" text-anchor="middle" >the owner took B and A, flags cleared</text><path class="edge-blue " d="M371 545 L274 545" marker-end="url(#a-blue)" /><text class="small muted" x="40" y="616" text-anchor="start" >The slab is active again, and the next allocation returns B.</text><text class="small muted" x="40" y="636" text-anchor="start" >If the owner marks the slab full while a block is already pending, the compare-and-swap on an empty word fails, so it collects instead of waiting for a notification.</text></svg>
