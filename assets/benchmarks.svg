<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 1040" width="980" height="1040" role="img" aria-label="Bars for eight kinds of workload showing each allocator’s speed relative to mimalloc on macOS and on Linux, and a chart of the memory still held after a burst is freed"><title>Bars for eight kinds of workload showing each allocator’s speed relative to mimalloc on macOS and on Linux, and a chart of the memory still held after a burst is freed</title><style>
