macOS footprint</text><text class="small" x="40" y="891" text-anchor="start">system</text><rect x="150" y="882" width="23.3" height="11" rx="2" style="fill:var(--gray);fill-opacity:.62;"/><text class="small muted" x="179.33678571428572" y="892" text-anchor="start">21.8 MiB</text><text class="small" x="40" y="911" text-anchor="start">bcmalloc</text><rect x="150" y="902" width="4.8" height="11" rx="2" style="fill:var(--blue);"/><text class="small b" x="160.80535714285713" y="912" text-anchor="start">4.5 MiB</text><text class="small" x="40" y="931" text-anchor="start">mimalloc</text><rect x="150" y="922" width="279.2" height="11" rx="2" style="fill:var(--purple);fill-opacity:.62;"/><text class="small muted" x="435.24107142857144" y="932" text-anchor="start">260.6 MiB</text><text class="small" x="40" y="951" text-anchor="start">jemalloc</text><rect x="150" y="942" width="285.3" height="11" rx="2" style="fill:var(--orange);fill-opacity:.62;"/><text class="small muted" x="441.3182142857143" y="952" text-anchor="start">266.3 MiB</text><text class="small" x="40" y="971" text-anchor="start">snmalloc</text><rect x="150" y="962" width="5.9" height="11" rx="2" style="fill:var(--green);fill-opacity:.62;"/><text class="small muted" x="161.89285714285714" y="972" text-anchor="start">5.5 MiB</text><text class="h" x="510" y="868" text-anchor="start">Linux resident set</text><text class="small" x="510" y="891" text-anchor="start">system</text><rect x="620" y="882" width="1.5" height="11" rx="2" style="fill:var(--gray);fill-opacity:.62;"/><text class="small muted" x="627.5" y="892" text-anchor="start">0.2 MiB</text><text class="small" x="510" y="911" text-anchor="start">bcmalloc</text><rect x="620" y="902" width="5.0" height="11" rx="2" style="fill:var(--blue);"/><text class="small b" x="630.9971428571429" y="912" text-anchor="start">4.7 MiB</text><text class="small" x="510" y="931" text-anchor="start">mimalloc</text><rect x="620" y="922" width="278.6" height="11" rx="2" style="fill:v