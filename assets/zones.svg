<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="The part of each NUMA node split into a small-page zone and a huge-page zone, with the slabs and runs of a small heap and of a big heap placed in them"><title>The part of each NUMA node split into a small-page zone and a huge-page zone, with the slabs and runs of a small heap and of a big heap placed in them</title><style>
:root{--ink:#1f2328;--muted:#59636e;--line:#d1d9e0;--panel:#f6f8fa;--page:#ffffff;--blue:#0969da;--blue-bg:#ddf4ff;--green:#1a7f37;--green-bg:#dafbe1;--orange:#bc4c00;--orange-bg:#fff1e5;--red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;--yellow:#9a6700;--yellow-bg:#fff8c5;--gray:#6e7781;--gray-bg:#eaeef2}
@media (prefers-color-scheme: dark){:root{--ink:#e6edf3;--muted:#9198a1;--line:#3d444d;--panel:#151b23;--page:#0d1117;--blue:#58a6ff;--blue-bg:#12263f;--green:#3fb950;--green-bg:#12261e;--orange:#f0883e;--orange-bg:#2f1d10;--red:#ff7b72;--red-bg:#35171a;--purple:#bc8cff;--purple-bg:#25193d;--yellow:#d29922;--yellow-bg:#2a2108;--gray:#8b949e;--gray-bg:#21262d}}
text{font-family:ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--ink);font-size:13px}
.mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.title{font-size:15px;font-weight:600}
.h{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;fill:var(--muted)}
.muted{fill:var(--muted)}
.small{font-size:11.5px}
.big{font-size:17px;font-weight:650}
.b{font-weight:600}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.page{fill:var(--page)}
.blue{fill:var(--blue-bg);stroke:var(--blue);stroke-width:1.4}
.green{fill:var(--green-bg);stroke:var(--green);stroke-width:1.4}
.orange{fill:var(--orange-bg);stroke:var(--orange);stroke-width:1.4}
.red{fill:var(--red-bg);stroke:var(--red);stroke-width:1.4}
.purple{fill:var(--purple-bg);stroke:var(--purple);stroke-width:1.4}
.yellow{fill:var(--yellow-bg);stroke:var(--yellow);stroke-width:1.4}
.gray{fill:var(--gray-bg);stroke:var(--gray);stroke-width:1.2}
.free{fill:var(--page);stroke:var(--line);stroke-width:1}
.edge{fill:none;stroke:var(--muted);stroke-width:1.5}
.edge-blue{fill:none;stroke:var(--blue);stroke-width:1.6}
.edge-green{fill:none;stroke:var(--green);stroke-width:1.6}
.edge-purple{fill:none;stroke:var(--purple);stroke-width:1.6}
.edge-orange{fill:none;stroke:var(--orange);stroke-width:2}
.edge-red{fill:none;stroke:var(--red);stroke-width:1.6}
.dash{stroke-dasharray:6 5}
.t-blue{fill:var(--blue)}.t-green{fill:var(--green)}.t-orange{fill:var(--orange)}.t-red{fill:var(--red)}.t-purple{fill:var(--purple)}
.f-ink{fill:var(--ink)}.f-muted{fill:var(--muted)}.f-blue{fill:var(--blue)}.f-green{fill:var(--green)}.f-orange{fill:var(--orange)}.f-purple{fill:var(--purple)}.f-red{fill:var(--red)}.f-gray{fill:var(--gray)}
</style><defs><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--muted)"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--blue)"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--green)"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--purple)"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--orange)"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5 L8.5 5 L1 8.5 z" fill="var(--red)"/></marker></defs><text class="title" x="40" y="34" text-anchor="start">Two zones per NUMA node</text><text class="small muted" x="40" y="54" text-anchor="start">The part of the region that belongs to a node is split in two. Only the upper half is advised to use transparent huge pages.</text><rect class="blue" x="40" y="90" width="450.0" height="70" rx="6"/><rect class="green" x="490.0" y="90" width="450.0" height="70" rx="6"/><text class="small b" x="265.0" y="80" text-anchor="middle">small-page zone, 4 KiB pages</text><text class="small b" x="715.0" y="80" text-anchor="middle">huge-page zone, MADV_HUGEPAGE, 2 MiB pages</text><rect class="free" x="50" y="102" width="22" height="46" rx="3"/><text class="mono small" x="61.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="76" y="102" width="22" height="46" rx="3"/><text class="mono small" x="87.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="102" y="102" width="22" height="46" rx="3"/><text class="mono small" x="113.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="128" y="102" width="22" height="46" rx="3"/><text class="mono small" x="139.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="154" y="102" width="22" height="46" rx="3"/><text class="mono small" x="165.0" y="129.0" text-anchor="middle">s</text><rect class="orange" x="350.0" y="102" width="64" height="46" rx="3"/><text class="mono small" x="382.0" y="129.0" text-anchor="middle">8 ch</text><rect class="purple" x="420.0" y="102" width="56" height="46" rx="3"/><text class="mono small" x="448.0" y="129.0" text-anchor="middle">run</text><rect class="free" x="500.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="511.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="526.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="537.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="552.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="563.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="578.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="589.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="604.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="615.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="630.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="641.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="656.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="667.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="682.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="693.0" y="129.0" text-anchor="middle">s</text><rect class="free" x="708.0" y="102" width="22" height="46" rx="3"/><text class="mono small" x="719.0" y="129.0" text-anchor="middle">s</text><rect class="orange" x="748.0" y="102" width="64" height="46" rx="3"/><text class="mono small" x="780.0" y="129.0" text-anchor="middle">8 ch</text><rect class="purple" x="710" y="102" width="110" height="46" rx="3"/><text class="mono small" x="765.0" y="129.0" text-anchor="middle">run, 3 MiB</text><rect class="purple" x="830" y="102" width="92" height="46" rx="3"/><text class="mono small" x="876.0" y="129.0" text-anchor="middle">run</text><rect class="free" x="40" y="190" width="16" height="16" rx="3"/><text class="small" x="62" y="203" text-anchor="start">single-chunk slab</text><rect class="orange" x="200" y="190" width="16" height="16" rx="3"/><text class="small" x="222" y="203" text-anchor="start">slab of 8 chunks</text><rect class="purple" x="360" y="190" width="16" height="16" rx="3"/><text class="small" x="382" y="203" text-anchor="start">block of whole chunks</text><text class="small muted" x="560" y="203" text-anchor="start">single chunks fill from the bottom of a zone, runs from the top</text><rect class="panel" x="40" y="226" width="900" height="220" rx="8"/><text class="h" x="60" y="252" text-anchor="start">where a heap’s chunks go</text><text class="b" x="60" y="282" text-anchor="start">a small heap</text><text class="small" x="200" y="282" text-anchor="start">slabs and blocks of whole chunks under 2 MiB</text><text class="small b t-blue" x="700" y="282" text-anchor="start">small-page zone</text><text class="b" x="60" y="310" text-anchor="start">a big heap</text><text class="small" x="200" y="310" text-anchor="start">single-chunk slabs, and blocks of whole chunks</text><text class="small b t-green" x="700" y="310" text-anchor="start">huge-page zone</text><text class="b" x="60" y="338" text-anchor="start"></text><text class="small" x="200" y="338" text-anchor="start">a slab of 8 chunks, once its class has filled one</text><text class="small b t-green" x="700" y="338" text-anchor="start">huge-page zone</text><text class="b" x="60" y="366" text-anchor="start">any heap</text><text class="small" x="200" y="366" text-anchor="start">a block of 2 MiB or more</text><text class="small b t-green" x="700" y="366" text-anchor="start">huge-page zone</text><text class="small muted" x="60" y="402" text-anchor="start">A heap is big once its filled slabs and its blocks of whole chunks hold 1 MiB, and stays big until they fall below 256 KiB.</text><text class="small muted" x="60" y="422" text-anchor="start">In the huge-page zone free chunks wait 100 ms, and only whole free 2 MiB pages go back, so huge pages stay whole.</text></svg>