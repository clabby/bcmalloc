[package]
name = "bcmalloc-bench-apps"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Real programs measured with the benchmark driver, as a held-out check against tuning to synthetic loops."

[dependencies]
bcmalloc = { workspace = true, features = ["std"] }
mimalloc.workspace = true
snmalloc-rs.workspace = true
tikv-jemallocator.workspace = true
libc = { workspace = true, features = ["std"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
syn = { version = "3", features = ["full", "parsing", "printing", "visit"] }
proc-macro2 = "1"
quote = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util", "macros"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[[bench]]
name = "system"
harness = false

[[bench]]
name = "bcmalloc"
harness = false

[[bench]]
name = "mimalloc"
harness = false

[[bench]]
name = "jemalloc"
harness = false

[[bench]]
name = "snmalloc"
harness = false

[lints]
workspace = true
