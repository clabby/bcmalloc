[workspace]
members = ["crates/*"]
# The fuzz targets are their own crate, which cargo-fuzz builds with its own flags.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/clabby/bcmalloc"

[workspace.dependencies]
bcmalloc = { path = "crates/bcmalloc", default-features = false }
libc = { version = "0.2", default-features = false }
mimalloc = "0.1"
snmalloc-rs = "0.7"
tikv-jemallocator = "0.7"

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unnameable_types = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)", "cfg(bcmalloc_portable_tls)"] }

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
missing_const_for_fn = "warn"
use_self = "warn"
option_if_let_else = "warn"
redundant_clone = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[profile.bench]
debug = "line-tables-only"

# snmalloc-sys 0.7 builds snmalloc as a CMake Debug build at -O0 whenever its build script sees
# debug info enabled, so the comparison builds it without debug info.
[profile.release.package.snmalloc-sys]
debug = false

[profile.bench.package.snmalloc-sys]
debug = false
